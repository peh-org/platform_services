apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/k8s_resources/namespaces.yaml
  - ../../base/k8s_resources/thumbdrive-storageclass.yaml

# Label all resources deployed into this environment
labels:
  - pairs:
      env: sandbox
    includeSelectors: false
    includeTemplates: true