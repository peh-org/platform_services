apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include base resources first, then layer in environment-specific patches
resources:
  - ../../base/helm/repos/istio-repo.yaml
  - ../../base/helm/releases/istio-helm.yaml

# Apply the per-environment version pins and overrides
patches:
  - path: istio.yaml

# Label all resources deployed into this environment
labels:
  - pairs:
      env: sandbox
    includeSelectors: false
    includeTemplates: true