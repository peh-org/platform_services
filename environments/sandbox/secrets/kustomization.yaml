apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:

  - ../../base/k8s_resources/clustersecretstore.yaml
  # - ../../base/k8s_resources/external_secrets/keycloak-postgres-auth.yaml
  - ../../base/k8s_resources/external_secrets/keycloak.yaml
  - ../../base/k8s_resources/external_secrets/postgres.yaml

# Label all resources deployed into this environment
labels:
  - pairs:
      env: sandbox
    includeSelectors: false
    includeTemplates: true