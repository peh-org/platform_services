apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include base resources first, then layer in environment-specific patches
resources:
  - ../../base/helm/repos/codecentric-keycloak-repo.yaml
  - ../../base/helm/releases/keycloak-helm.yaml
  - ../../base/helm/repos/bitnami-postgres-repo.yaml
  - ../../base/helm/releases/postgres-helm.yaml

# Apply the per-environment version pins and overrides
patches:
  - path: postgres.yaml
  - path: keycloak.yaml

# Label all resources deployed into this environment
labels:
  - pairs:
      env: sandbox
    includeSelectors: false
    includeTemplates: true