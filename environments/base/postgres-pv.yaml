apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-pv
  namespace: keycloak  # Or your PostgreSQL namespace
spec:
  capacity:
    storage: 15Gi  # Adjust to your thumb drive size
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # Keep data if HelmRelease is deleted
  hostPath:
    path: /mnt/thumbdrive  # Path inside the Kind node (mounted from thumb drive)
    type: DirectoryOrCreate