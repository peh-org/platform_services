apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: flux-system          # flux executes from this namespace
spec:
  dependsOn:
    - name: external-secrets
      namespace: flux-system
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: bitnami-postgresql
    namespace: flux-system
  targetNamespace: keycloak
  install:
    timeout: 8m0s
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    auth:
      username: "keycloakuser"
      database: "keycloakdb"
      existingSecret: postgres-auth
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      service:
        type: ClusterIP  # Use ClusterIP for internal access (Keycloak will connect via service name)
      config: |
        max_connections=200
      persistence:
        enabled: true
        storageClass: thumbdrive-local
        size: 8Gi
  rollback:
    disableWait: true
    disableWaitForJobs: true
    disableHooks: true
    # recreate: true
    force: true
    cleanupOnFail: true
  driftDetection: 
    mode: enabled