apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-auth
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-secret-store
  target:
    name: keycloak-postgres-password
    creationPolicy: Owner
  data:
    - secretKey: keycloak-postgres-password
      remoteRef:
        key: keycloak_postgres/auth
        property: password