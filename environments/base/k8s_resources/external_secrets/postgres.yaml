apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-secret-store
  target:
    name: postgres-auth
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres/admin
        property: password
    - secretKey: password
      remoteRef:
        key: postgres/keycloakuser
        property: password